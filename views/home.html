<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deck URL Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <a class="active" href="home.html">Decks</a>
    <a href="game-stats.html">Game Stats</a>
    <a href="deck-stats.html">Deck Stats</a>
  </nav>

  <h1>Deck URL Tracker</h1>
  <p>Save and open deck URLs for later visualizations.</p>

  <form id="deckForm" style = "background-color: #4f4f4f; color: #ffffff;">
    <label>
      Deck Name
      <input id="deckName" type="text" placeholder="e.g. My Main Deck" required />
    </label>
    <label>
      Deck URL
      <input id="deckUrl" type="url" placeholder="https://example.com/deck" required />
    </label>
    <button type="submit">Save Deck</button>
  </form>

  <div class="deck-list">
    <h2>Saved Decks</h2>
    <div id="savedDecks"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    async function loadData() { return ipcRenderer.invoke('load-data'); }

    async function saveDecks(decks) {
      const data = await loadData();
      await ipcRenderer.invoke('save-data', { ...data, decks });
    }

    async function render() {
      const container = document.getElementById('savedDecks');
      const { decks } = await loadData();
      container.innerHTML = '';
      if (!decks.length) { container.innerHTML = '<p>No saved decks yet.</p>'; return; }
      decks.forEach((deck, idx) => {
        const node = document.createElement('div'); node.className = 'deck-item';
        const info = document.createElement('p');
        info.innerHTML = `<strong>${deck.name}</strong><br><a href="${deck.url}" target="_blank" rel="noopener noreferrer" style="color: #80a2ff;">${deck.url}</a>`;
        const actions = document.createElement('div'); actions.className = 'deck-actions';
        const openLink = document.createElement('a'); openLink.href = deck.url; openLink.target = '_blank'; openLink.rel = 'noopener noreferrer'; openLink.textContent = 'Open';
        const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = 'Remove';
        remove.addEventListener('click', async () => { const { decks: currentDecks } = await loadData(); const updated = currentDecks.filter((_, i) => i !== idx); await saveDecks(updated); render(); });
        actions.append(openLink, remove); node.append(info, actions); container.appendChild(node);
      });
    }

    document.getElementById('deckForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('deckName').value.trim();
      const url = document.getElementById('deckUrl').value.trim();
      if (!name || !url) { alert('Both deck name and URL are required.'); return; }
      const { decks } = await loadData(); decks.push({ name, url }); await saveDecks(decks);
      document.getElementById('deckForm').reset(); render();
    });

    render().catch(error => {
      console.error('Unable to load deck data:', error);
      document.getElementById('savedDecks').innerHTML = '<p>Unable to load data.json. Check the Electron terminal for details.</p>';
    });
  </script>
</body>
</html>
